name: Upstream Sync

# Keep local workflows protected. Sync only project files from upstream.
permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync upstream code without workflow overwrite
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync upstream files
        run: |
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main

          # Update upstream code but never overwrite local workflows.
          git checkout upstream/main -- . ':!.github/workflows'

          if git diff --quiet; then
            echo "No upstream code changes."
            exit 0
          fi

          git add .
          git commit -m "Sync upstream changes without workflow overwrite"
          git push origin main

      - name: Sync result
        if: failure()
        run: |
          echo "Upstream sync failed. Local workflow files were protected."
          exit 1
